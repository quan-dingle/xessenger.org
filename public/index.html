<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta charset="utf-8">
    <title>XSngr</title>
</head>
<body>
<canvas id="background"></canvas>

<div id="app-container">
    <div id="top">
        <img id="chat-icon" src="chat-icon">
        <div id="room-area">
            <select id="room-selector"></select><button id="new-room" onclick="createRoom()">+</button>
        </div>
        <img id="pfp" src="pfp">
    </div>
    <div id="chat"></div>
    <div id="bottom">
        <input id="msg" autofocus>
        <button id="send-msg">Send</button>
        <button id="open-prefs" aria-label="Preferences">⚙</button>
        <button id="upload">+</button>
    </div>
</div>
<script src="app.js"></script>
<script src="background.js" id="bg-script"></script>
</body>
</html>
