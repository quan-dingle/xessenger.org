<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pattern - 3</title>
    <style>
        body {
            font-family: monospace;
            color: #FFF;
            background: #000;
            font-size: 2px;
        }
    </style>
</head>
<body>

<script>
    function pRound(n) {return Math.random()+Math.trunc(n)>n?Math.floor(n):Math.ceil(n)}

    function create() {
        const dims = [900,2350];
        const chars = " .-,:;(!?+@#█" //█
        const screen = Array(dims[0]).fill(null).map(()=>Array(dims[1]).fill(" "));
        const cy = dims[0]/2;
        const cx = dims[1]/2;

        for (let y = 0; y < screen.length; y++) {
            for (let x = 0; x < screen[0].length; x+=.5) {
                const dx = (cx-x);
                const dy = (cy-y);
                const dist = dx**2+dy**2;
                const phase = 5+5*Math.sin((Math.log(dist)+Math.atan2(dx,dy))*10);
                screen[y][x] = chars[pRound(phase)];
            }
        }
        return screen;
    }
    document.body.innerHTML = ` <pre>${create().map(r=>r.join("")).join("\n")}</pre> `;

</script>
</body>
</html>
