<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pattern - 9</title>
    <style>
        body {
            font-family: monospace;
            color: #FFF;
            background: #000;
            font-size: 18px;
        }
    </style>
</head>
<body>

<script>
    function pRound(n) {return Math.random()+Math.trunc(n)>n?Math.floor(n):Math.ceil(n)}

    function create() {
        const dims = [64,250];
        const chars = " .-,:;(!?+i@t█"; //█
        const screen = Array(dims[0]).fill(null).map(()=>Array(dims[1]).fill(" "));
        const e = 2.718281828;

        for (let y = 0; y < dims[0]; y++) {
            for (let x = 0; x < dims[1]; x++) {
                const x_ = (x-dims[1]/2)/30;
                const y_ = -(y-dims[0]/2)/20;

                const val = ((x_**2)+(y_**2)-1)**3 -(x_**2)*(y_**3);
                //if (val>150) continue;

                if (val<0) {
                    screen[y][x] = chars[pRound(-Math.log(val)/2)>14?14:13];
                    console.log(val);
                }
                else {
                    const shadow = pRound(1/Math.sqrt(val)*2+.2);
                    screen[y][x] = chars[shadow<0?0:shadow>12?12:shadow];
                }
            }
        }
        return screen;
    }
    document.body.innerHTML = ` <pre>${create().map(r=>r.join("")).join("\n")}</pre> `;

</script>
</body>
</html>
