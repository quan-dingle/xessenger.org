<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swarm</title>
    <style>
        :root {
            --ui-bg: rgba(12, 12, 12, 0.52);
            --ui-border: rgba(255, 255, 255, 0.11);
            --ui-text: rgba(255, 255, 255, 0.82);
            --ui-muted: rgba(255, 255, 255, 0.42);
            --ui-hover: rgba(255, 255, 255, 0.08);
            --bg-color: #060508;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg-color);
            color: #fff;
            font-family: monospace;
            user-select: none;
        }

        #canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* --------------------------------------------------
           MENU BUTTON
        -------------------------------------------------- */
        #menuButton {
            position: fixed;
            top: 18px;
            left: 18px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--ui-border);
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.72);
            background: rgba(10, 10, 10, 0.28);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer;
            z-index: 20;
            transition: opacity 0.8s ease, transform 0.8s ease, background 0.2s ease;
        }

        #menuButton:hover {
            background: rgba(255, 255, 255, 0.09);
            color: #fff;
        }

        #menuButton.hidden {
            opacity: 0;
            transform: scale(0.82);
            pointer-events: none;
        }

        #menuIcon {
            font-size: 17px;
            line-height: 1;
            transition: transform 0.3s ease;
        }

        #menuButton.open #menuIcon {
            transform: rotate(90deg);
        }

        /* --------------------------------------------------
           CONTROL PANEL
        -------------------------------------------------- */
        #controls {
            position: fixed;
            top: 18px;
            left: 18px;
            width: min(330px, calc(100vw - 36px));
            max-height: calc(100vh - 36px);
            padding: 20px;
            background: var(--ui-bg);
            border: 1px solid var(--ui-border);
            border-radius: 18px;
            backdrop-filter: blur(24px) saturate(120%);
            -webkit-backdrop-filter: blur(24px) saturate(120%);
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.035);
            z-index: 15;
            overflow-y: auto;
            opacity: 0;
            transform: translateY(-8px) scale(0.97);
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        #controls.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        #controls::-webkit-scrollbar { width: 3px; }
        #controls::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 10px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 14px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.8);
        }

        .panel-subtitle {
            margin-top: 4px;
            font-size: 10px;
            color: var(--ui-muted);
            letter-spacing: 0.04em;
        }

        #closeButton {
            width: 28px;
            height: 28px;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-family: inherit;
            font-size: 18px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        #closeButton:hover {
            background: var(--ui-hover);
            color: #fff;
        }

        /* --------------------------------------------------
           SECTIONS
        -------------------------------------------------- */
        .section { margin-bottom: 21px; }

        .section-title {
            margin-bottom: 11px;
            font-size: 9px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.32);
        }

        .control { margin-bottom: 14px; }

        .control-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 7px;
            color: rgba(255, 255, 255, 0.62);
            font-size: 11px;
        }

        .value {
            color: rgba(255, 255, 255, 0.42);
            min-width: 50px;
            text-align: right;
        }

        /* --------------------------------------------------
           RANGE SLIDERS (CROSS-BROWSER)
        -------------------------------------------------- */
        input[type="range"] {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 100%;
            height: 12px;
            margin: 0;
            background: transparent;
            outline: none;
            cursor: pointer;
        }

        /* WebKit */
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 10px;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 11px;
            height: 11px;
            margin-top: -4.5px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.7);
            background: #111;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.04);
            transition: transform 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.25); }

        /* Firefox */
        input[type="range"]::-moz-range-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 10px;
        }
        input[type="range"]::-moz-range-thumb {
            appearance: none;
            -moz-appearance: none;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.7);
            background: #111;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.04);
            transition: transform 0.15s ease;
        }
        input[type="range"]::-moz-range-thumb:hover { transform: scale(1.25); }

        /* --------------------------------------------------
           COLORS & BUTTONS
        -------------------------------------------------- */
        .color-row { display: flex; gap: 8px; }
        .color-control { flex: 1; }

        input[type="color"] {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 100%;
            height: 30px;
            padding: 3px;
            border: 1px solid var(--ui-border);
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.04);
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 4px; }
        input[type="color"]::-moz-color-swatch { border: 0; border-radius: 4px; }

        .button-row { display: flex; gap: 7px; }

        .action {
            flex: 1;
            height: 32px;
            border: 1px solid var(--ui-border);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.035);
            color: rgba(255, 255, 255, 0.55);
            font-family: inherit;
            font-size: 10px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .action:hover {
            background: rgba(255, 255, 255, 0.09);
            color: #fff;
        }

        #hint {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
            pointer-events: none;
            letter-spacing: 0.08em;
            transition: opacity 1.5s ease;
        }

        @media (max-width: 500px) {
            #controls {
                top: 10px;
                left: 10px;
                width: calc(100vw - 20px);
                max-height: calc(100vh - 20px);
                padding: 17px;
            }
            #menuButton { top: 10px; left: 10px; }
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<button id="menuButton" aria-label="Open controls">
    <span id="menuIcon">☰</span>
</button>

<div id="hint">click and hold to gather the swarm</div>

<div id="controls">
    <div class="panel-header">
        <div>
            <div class="panel-title">swarm</div>
            <div class="panel-subtitle">guide the collective</div>
        </div>
        <button id="closeButton">×</button>
    </div>

    <!-- SWARM SETTINGS -->
    <div class="section">
        <div class="section-title">swarm</div>
        <div class="control">
            <div class="control-label">
                <span>population</span>
                <span class="value" id="populationValue"></span>
            </div>
            <input id="population" type="range" min="50" max="350" step="10" value="180">
        </div>
        <div class="control">
            <div class="control-label">
                <span>max speed</span>
                <span class="value" id="maxSpeedValue"></span>
            </div>
            <input id="maxSpeed" type="range" min="1.0" max="6.0" step="0.1" value="2.8">
        </div>
        <div class="control">
            <div class="control-label">
                <span>perception radius</span>
                <span class="value" id="perceptionValue"></span>
            </div>
            <input id="perception" type="range" min="30" max="200" step="5" value="85">
        </div>
    </div>

    <!-- INSTINCTS -->
    <div class="section">
        <div class="section-title">instincts</div>
        <div class="control">
            <div class="control-label">
                <span>separation</span>
                <span class="value" id="separationValue"></span>
            </div>
            <input id="separation" type="range" min="0.01" max="0.1" step="0.001" value="0.05">
        </div>
        <div class="control">
            <div class="control-label">
                <span>alignment</span>
                <span class="value" id="alignmentValue"></span>
            </div>
            <input id="alignment" type="range" min="0.005" max="0.1" step="0.001" value="0.045">
        </div>
        <div class="control">
            <div class="control-label">
                <span>cohesion</span>
                <span class="value" id="cohesionValue"></span>
            </div>
            <input id="cohesion" type="range" min="0.001" max="0.02" step="0.001" value="0.004">
        </div>
    </div>

    <!-- VISUALS -->
    <div class="section">
        <div class="section-title">appearance</div>
        <div class="control">
            <div class="control-label">
                <span>trail memory</span>
                <span class="value" id="fadeValue"></span>
            </div>
            <input id="fade" type="range" min="0.1" max="0.8" step="0.05" value="0.3">
        </div>
        <div class="color-row">
            <div class="color-control">
                <div class="control-label"><span>nodes</span></div>
                <input id="color1" type="color" value="#ffffff">
            </div>
            <div class="color-control">
                <div class="control-label"><span>links</span></div>
                <input id="color2" type="color" value="#ffbb66">
            </div>
        </div>
    </div>

    <!-- SYSTEM -->
    <div class="section">
        <div class="section-title">system</div>
        <div class="button-row">
            <button class="action" id="scatter">scatter</button>
            <button class="action" id="reset">reset</button>
        </div>
    </div>
</div>

<script>
    /* =====================================================
       UI & MENUS
    ===================================================== */
    const menuButton = document.getElementById("menuButton");
    const closeButton = document.getElementById("closeButton");
    const controls = document.getElementById("controls");
    const hint = document.getElementById("hint");

    let menuOpen = false;
    let idleTimer;

    function openMenu() {
        menuOpen = true;
        controls.classList.add("open");
        menuButton.classList.add("open");
        clearTimeout(idleTimer);
    }

    function closeMenu() {
        menuOpen = false;
        controls.classList.remove("open");
        menuButton.classList.remove("open");
        resetIdleTimer();
    }

    menuButton.addEventListener("click", e => {
        e.stopPropagation();
        menuOpen ? closeMenu() : openMenu();
    });

    closeButton.addEventListener("click", e => {
        e.stopPropagation();
        closeMenu();
    });

    function resetIdleTimer() {
        clearTimeout(idleTimer);
        if (menuOpen) return;
        menuButton.classList.remove("hidden");
        idleTimer = setTimeout(() => {
            if (!menuOpen) menuButton.classList.add("hidden");
        }, 2800);
    }

    document.addEventListener("mousemove", e => {
        if (e.clientX < 100 && e.clientY < 100) resetIdleTimer();
        resetIdleTimer();
    });
    resetIdleTimer();
    setTimeout(() => { hint.style.opacity = '0'; }, 6000);

    /* =====================================================
       SETTINGS & BINDINGS
    ===================================================== */
    const DEFAULTS = {
        population: 180,
        maxSpeed: 2.8,
        perception: 85,
        separation: 0.05,
        alignment: 0.045,
        cohesion: 0.004,
        fade: 0.3,
        color1: "#ffffff",
        color2: "#ffbb66"
    };

    const settings = { ...DEFAULTS };

    const controlsMap = {
        population: { value: "populationValue", format: v => Math.round(v) },
        maxSpeed: { value: "maxSpeedValue", format: v => Number(v).toFixed(1) },
        perception: { value: "perceptionValue", format: v => Math.round(v) },
        separation: { value: "separationValue", format: v => Number(v).toFixed(3) },
        alignment: { value: "alignmentValue", format: v => Number(v).toFixed(3) },
        cohesion: { value: "cohesionValue", format: v => Number(v).toFixed(3) },
        fade: { value: "fadeValue", format: v => Number(v).toFixed(2) }
    };

    for (const [id, config] of Object.entries(controlsMap)) {
        const input = document.getElementById(id);
        const output = document.getElementById(config.value);

        input.addEventListener("input", () => {
            settings[id] = parseFloat(input.value);
            output.textContent = config.format(settings[id]);
            if(id === "population") balancePopulation();
        });
        settings[id] = parseFloat(input.value);
        output.textContent = config.format(settings[id]);
    }

    document.getElementById("color1").addEventListener("input", e => settings.color1 = e.target.value);
    document.getElementById("color2").addEventListener("input", e => settings.color2 = e.target.value);

    /* =====================================================
       HELPERS
    ===================================================== */
    function hexToRgb(hex) {
        hex = hex.replace("#", "");
        return {
            r: parseInt(hex.substring(0, 2), 16),
            g: parseInt(hex.substring(2, 4), 16),
            b: parseInt(hex.substring(4, 6), 16)
        };
    }

    /* =====================================================
       CANVAS & MATH
    ===================================================== */
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { alpha: false });

    let width, height;
    let boids = [];

    let isDrawing = false;
    let mouseX = -1000;
    let mouseY = -1000;

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = "#060508";
        ctx.fillRect(0, 0, width, height);
    }
    window.addEventListener("resize", resize);
    resize();

    class Boid {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            const angle = Math.random() * Math.PI * 2;
            this.vx = Math.cos(angle) * settings.maxSpeed;
            this.vy = Math.sin(angle) * settings.maxSpeed;
            this.ax = 0;
            this.ay = 0;
        }

        flock(boids) {
            let cx = 0, cy = 0; // Cohesion center
            let avx = 0, avy = 0; // Alignment velocity
            let sx = 0, sy = 0; // Separation force
            let neighborCount = 0;

            const pSq = settings.perception * settings.perception;
            const sepSq = (settings.perception * 0.4) * (settings.perception * 0.4);

            for (let other of boids) {
                if (other === this) continue;

                let dx = this.x - other.x;
                let dy = this.y - other.y;
                let distSq = dx*dx + dy*dy;

                if (distSq < pSq) {
                    neighborCount++;
                    cx += other.x;
                    cy += other.y;
                    avx += other.vx;
                    avy += other.vy;

                    if (distSq < sepSq) {
                        let dist = Math.sqrt(distSq) || 0.001;
                        sx += (dx / dist);
                        sy += (dy / dist);
                    }
                }
            }

            if (neighborCount > 0) {
                cx /= neighborCount;
                cy /= neighborCount;
                avx /= neighborCount;
                avy /= neighborCount;

                // Cohesion
                this.ax += (cx - this.x) * settings.cohesion;
                this.ay += (cy - this.y) * settings.cohesion;
                // Alignment
                this.ax += (avx - this.vx) * settings.alignment;
                this.ay += (avy - this.vy) * settings.alignment;
            }

            // Separation
            this.ax += sx * settings.separation;
            this.ay += sy * settings.separation;

            // Mouse Interaction (Attractor)
            if (isDrawing) {
                let dx = mouseX - this.x;
                let dy = mouseY - this.y;
                let mDist = Math.sqrt(dx*dx + dy*dy) || 0.001;
                // Strong pull towards mouse
                this.ax += (dx / mDist) * 0.4;
                this.ay += (dy / mDist) * 0.4;
            }

            // Soft boundaries to keep them on screen smoothly
            const margin = 100;
            const turnFactor = 0.2;
            if (this.x < margin) this.ax += turnFactor;
            if (this.x > width - margin) this.ax -= turnFactor;
            if (this.y < margin) this.ay += turnFactor;
            if (this.y > height - margin) this.ay -= turnFactor;
        }

        update() {
            this.vx += this.ax;
            this.vy += this.ay;

            // Limit speed
            let speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
            if (speed > settings.maxSpeed) {
                this.vx = (this.vx / speed) * settings.maxSpeed;
                this.vy = (this.vy / speed) * settings.maxSpeed;
            }
            if (speed < settings.maxSpeed * 0.2) {
                this.vx = (this.vx / speed) * (settings.maxSpeed * 0.2);
                this.vy = (this.vy / speed) * (settings.maxSpeed * 0.2);
            }

            this.x += this.vx;
            this.y += this.vy;

            // Reset acceleration
            this.ax = 0;
            this.ay = 0;
        }
    }

    function balancePopulation() {
        const target = settings.population;
        if (boids.length > target) {
            boids.splice(target);
        } else {
            while (boids.length < target) {
                boids.push(new Boid());
            }
        }
    }
    balancePopulation();

    /* =====================================================
       INTERACTION
    ===================================================== */
    window.addEventListener("mousedown", e => {
        if (e.target !== canvas) return;
        isDrawing = true;
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    window.addEventListener("mousemove", e => {
        if (!isDrawing) return;
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    window.addEventListener("mouseup", () => isDrawing = false);

    // Touch support
    window.addEventListener("touchstart", e => {
        if (e.target !== canvas) return;
        isDrawing = true;
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
    }, {passive: false});

    window.addEventListener("touchmove", e => {
        if (!isDrawing) return;
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
    }, {passive: false});

    window.addEventListener("touchend", () => isDrawing = false);

    document.getElementById("scatter").addEventListener("click", () => {
        boids.forEach(b => {
            b.vx += (Math.random() - 0.5) * 20;
            b.vy += (Math.random() - 0.5) * 20;
        });
    });

    document.getElementById("reset").addEventListener("click", () => {
        for (const [key, value] of Object.entries(DEFAULTS)) {
            settings[key] = value;
            const input = document.getElementById(key);
            if (input) input.value = value;
            const config = controlsMap[key];
            if (config) document.getElementById(config.value).textContent = config.format(value);
        }
        document.getElementById("color1").value = DEFAULTS.color1;
        document.getElementById("color2").value = DEFAULTS.color2;
        boids = [];
        balancePopulation();
        ctx.fillStyle = "#060508";
        ctx.fillRect(0, 0, width, height);
    });

    /* =====================================================
       ANIMATION LOOP
    ===================================================== */
    function frame() {
        // Soft trail fade
        ctx.fillStyle = `rgba(6, 5, 8, ${settings.fade})`;
        ctx.fillRect(0, 0, width, height);

        const rgb1 = hexToRgb(settings.color1);
        const rgb2 = hexToRgb(settings.color2);

        // Calculate physics
        for (let i = 0; i < boids.length; i++) {
            boids[i].flock(boids);
        }

        // Apply physics
        for (let i = 0; i < boids.length; i++) {
            boids[i].update();
        }

        // Draw geometric links
        const pSq = settings.perception * settings.perception;
        ctx.lineWidth = 0.6;

        for (let i = 0; i < boids.length; i++) {
            let b = boids[i];
            for (let j = i + 1; j < boids.length; j++) {
                let other = boids[j];
                let dx = b.x - other.x;
                let dy = b.y - other.y;
                let distSq = dx*dx + dy*dy;

                if (distSq < pSq * 0.8) {
                    let alpha = 1 - (distSq / (pSq * 0.8));
                    ctx.beginPath();
                    ctx.moveTo(b.x, b.y);
                    ctx.lineTo(other.x, other.y);
                    ctx.strokeStyle = `rgba(${rgb2.r}, ${rgb2.g}, ${rgb2.b}, ${alpha * 0.4})`;
                    ctx.stroke();
                }
            }
        }

        // Draw nodes (Boids)
        for (let i = 0; i < boids.length; i++) {
            let b = boids[i];
            ctx.beginPath();
            // Draw a slightly elongated teardrop/line in the direction of travel
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(b.x - b.vx * 1.5, b.y - b.vy * 1.5);
            ctx.strokeStyle = `rgba(${rgb1.r}, ${rgb1.g}, ${rgb1.b}, 1.0)`;
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Bright core
            ctx.beginPath();
            ctx.arc(b.x, b.y, 1.2, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
        }

        requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);

</script>
</body>
</html>
